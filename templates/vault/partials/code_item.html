<div class="item-body item-code">
    <div class="code-header">
        <span class="code-lang">{{ item.language|default:"text" }}</span>
        <button type="button" class="copy-btn" data-copy-target="code-{{ item.id }}">Copy</button>
    </div>
    <pre class="code-block"><code id="code-{{ item.id }}">{{ item.content }}</code></pre>
</div>
